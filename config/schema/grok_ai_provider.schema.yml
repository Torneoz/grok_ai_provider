grok_ai_provider.settings:
  type: config_object
  label: 'Grok AI Provider settings'
  mapping:
    api_key:
      type: string
      label: 'The xAI API key provided by the Key module'
    host:
      type: string
      label: 'The xAI API base URL'
    default_model:
      type: string
      label: 'Default Grok chat model'
    transport:
      type: string
      label: 'Transport selection mode'
    request_timeout:
      type: integer
      label: 'Responses API request timeout in seconds'
    store_responses:
      type: boolean
      label: 'Allow xAI to store Responses API requests'
    pricing_json:
      type: text
      label: 'Fallback xAI model pricing JSON'
    explorer_prompts:
      type: mapping
      label: 'Drupal AI Explorer default prompts'
      mapping:
        chat:
          type: text
          label: 'Chat prompt'
        image_to_image:
          type: text
          label: 'Image-to-image prompt'
        text_to_video:
          type: text
          label: 'Text-to-video prompt'
        moderation:
          type: text
          label: 'Moderation prompt'
        text_to_image:
          type: text
          label: 'Text-to-image prompt'
        text_to_speech:
          type: text
          label: 'Text-to-speech prompt'
    hosted_tools:
      type: mapping
      label: 'Permitted xAI hosted tools'
      mapping:
        web_search:
          type: boolean
          label: 'Permit Web Search'
        x_search:
          type: boolean
          label: 'Permit X Search'
        code_interpreter:
          type: boolean
          label: 'Permit Code Interpreter'
        file_search:
          type: boolean
          label: 'Permit Collections Search'
        mcp:
          type: boolean
          label: 'Permit remote MCP tools'
    mcp_servers:
      type: sequence
      label: 'Allowlisted remote MCP servers'
      sequence:
        type: mapping
        mapping:
          label:
            type: string
            label: 'Server label'
          url:
            type: string
            label: 'Server URL'
          allowed_tools:
            type: sequence
            label: 'Allowed MCP tool names'
            sequence:
              type: string

grok_ai_provider.default_operation_provider:
  type: ai.default_operation_provider
  label: 'Default text to video provider'
