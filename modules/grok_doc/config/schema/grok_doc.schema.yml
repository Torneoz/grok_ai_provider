grok_doc.collection.*:
  type: config_entity
  label: 'Grok collection'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
      label: 'UUID'
    remote_id:
      type: string
      label: 'xAI collection ID'
    description:
      type: text
      label: 'Description'
    management_key:
      type: string
      label: 'Management API Key entity ID'
    enabled:
      type: boolean
      label: 'Enabled for ingestion'
    searchable:
      type: boolean
      label: 'Available to Grok search configurations'
    default_metadata:
      type: text
      label: 'Default metadata JSON'
    max_batch_bytes:
      type: integer
      label: 'Maximum bytes per import batch'

