grok_doc.settings:
  type: config_object
  label: 'Grok Documents settings'
  mapping:
    max_file_bytes:
      type: integer
      label: 'Maximum file size'
    max_batch_bytes:
      type: integer
      label: 'Maximum batch size'
    max_attempts:
      type: integer
      label: 'Maximum upload attempts'
    queue_batch_size:
      type: integer
      label: 'Queue items processed per manual run'

