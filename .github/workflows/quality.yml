name: Quality

on:
  push:
    branches: [1.x, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Drupal 10.6 / minimum dependencies
            php: '8.1'
            drupal: '^10.6'
            dependency_flags: '--prefer-lowest'
          - name: Drupal 11 / current dependencies
            php: '8.3'
            drupal: '^11'
            dependency_flags: ''
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Select Drupal core version
        run: composer require --no-interaction --no-update "drupal/core:${{ matrix.drupal }}"
      - name: Resolve dependency matrix
        run: composer update --no-interaction --prefer-dist --with-all-dependencies ${{ matrix.dependency_flags }}
      - run: composer phpcs
      - run: composer test

  release-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject forbidden release files
        run: |
          git archive --format=tar HEAD > /tmp/grok-release.tar
          if tar -tf /tmp/grok-release.tar | grep -E '(^|/)(\.DS_Store|\.vscode|vendor|composer\.lock|\.phpunit\.cache)(/|$)|\.(env|key|pem|mp3|mp4)$'; then
            echo 'Forbidden local, credential, or generated-media file found in release archive.' >&2
            exit 1
          fi
