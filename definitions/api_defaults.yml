chat:
  input:
    description: 'Messages supplied to the model.'
    type: 'array'
    default:
      - { role: 'system', content: 'You are a helpful assistant.' }
      - { role: 'user', content: 'Introduce yourself!' }
    required: true
  authentication:
    description: 'xAI API key.'
    type: 'string'
    default: ''
    required: true
  configuration:
    max_tokens:
      label: 'Max tokens'
      description: 'The maximum number of tokens generated in the response.'
      type: 'integer'
      default: 4096
      required: false
      constraints:
        min: 1
    temperature:
      label: 'Temperature'
      description: 'Sampling temperature. Change temperature or Top P, but normally not both.'
      type: 'float'
      default: 1
      required: false
      constraints:
        min: 0
        max: 2
        step: 0.1
    top_p:
      label: 'Top P'
      description: 'Nucleus sampling probability. Change Top P or temperature, but normally not both.'
      type: 'float'
      default: 1
      required: false
      constraints:
        min: 0
        max: 1
        step: 0.1
    frequency_penalty:
      label: 'Frequency penalty'
      description: 'Penalizes tokens according to how often they already occur.'
      type: 'float'
      default: 0
      required: false
      constraints:
        min: -2
        max: 2
        step: 0.1
    presence_penalty:
      label: 'Presence penalty'
      description: 'Penalizes tokens that have already occurred.'
      type: 'float'
      default: 0
      required: false
      constraints:
        min: -2
        max: 2
        step: 0.1
    seed:
      label: 'Seed'
      description: 'Requests deterministic sampling on a best-effort basis.'
      type: 'integer'
      default: 0
      required: false
    use_responses_api:
      label: 'Use Responses API'
      description: 'Use xAI Responses even when no hosted tool is selected.'
      type: 'boolean'
      default: false
      required: false
    web_search:
      label: 'Web Search'
      description: 'Allow Grok to search and browse the web. This must also be permitted in the provider settings.'
      type: 'boolean'
      default: false
      required: false
    web_allowed_domains:
      label: 'Allowed web domains'
      description: 'Optional comma-separated domain allowlist, with a maximum of five domains.'
      type: 'string'
      default: ''
      required: false
    web_excluded_domains:
      label: 'Excluded web domains'
      description: 'Optional comma-separated domain denylist, with a maximum of five domains. Do not combine with allowed domains.'
      type: 'string'
      default: ''
      required: false
    web_image_search:
      label: 'Web image search'
      description: 'Allow Web Search to find images for the response.'
      type: 'boolean'
      default: false
      required: false
    web_image_understanding:
      label: 'Web image understanding'
      description: 'Allow Grok to inspect images found while browsing.'
      type: 'boolean'
      default: false
      required: false
    x_search:
      label: 'X Search'
      description: 'Allow Grok to search X. This must also be permitted in the provider settings.'
      type: 'boolean'
      default: false
      required: false
    x_allowed_handles:
      label: 'Allowed X handles'
      description: 'Optional comma-separated X handle allowlist.'
      type: 'string'
      default: ''
      required: false
    x_excluded_handles:
      label: 'Excluded X handles'
      description: 'Optional comma-separated X handle denylist.'
      type: 'string'
      default: ''
      required: false
    x_from_date:
      label: 'X search start date'
      description: 'Optional inclusive date in YYYY-MM-DD format.'
      type: 'string'
      default: ''
      required: false
    x_to_date:
      label: 'X search end date'
      description: 'Optional inclusive date in YYYY-MM-DD format.'
      type: 'string'
      default: ''
      required: false
    x_image_understanding:
      label: 'X image understanding'
      description: 'Allow Grok to inspect images found on X.'
      type: 'boolean'
      default: false
      required: false
    x_video_understanding:
      label: 'X video understanding'
      description: 'Allow Grok to inspect videos found on X.'
      type: 'boolean'
      default: false
      required: false
    code_interpreter:
      label: 'Code Interpreter'
      description: 'Allow Grok to execute Python in xAI’s isolated environment.'
      type: 'boolean'
      default: false
      required: false
    file_search:
      label: 'Collections Search'
      description: 'Allow Grok to search the configured xAI collections.'
      type: 'boolean'
      default: false
      required: false
    collection_ids:
      label: 'Collection IDs'
      description: 'Comma-separated xAI collection IDs available to this request.'
      type: 'string'
      default: ''
      required: false
    file_search_max_results:
      label: 'Maximum collection results'
      description: 'Maximum number of collection search results.'
      type: 'integer'
      default: 10
      required: false
      constraints:
        min: 1
        max: 50
    mcp_servers:
      label: 'Remote MCP servers'
      description: 'Comma-separated labels of allowlisted MCP servers to expose to Grok.'
      type: 'string'
      default: ''
      required: false
text_to_image:
  input:
    description: 'A text description of the image to generate.'
    type: 'string'
    default: ''
    required: true
  authentication:
    description: 'xAI API key.'
    type: 'string'
    default: ''
    required: true
  configuration:
    n:
      label: 'Number of images'
      description: 'The number of image variations to generate.'
      type: 'integer'
      default: 1
      required: false
      constraints:
        min: 1
        max: 4
    aspect_ratio:
      label: 'Aspect ratio'
      description: 'The width-to-height ratio of each generated image.'
      type: 'string'
      default: 'auto'
      required: false
      constraints:
        options:
          - 'auto'
          - '1:1'
          - '16:9'
          - '9:16'
          - '4:3'
          - '3:4'
          - '3:2'
          - '2:3'
          - '2:1'
          - '1:2'
          - '19.5:9'
          - '9:19.5'
          - '20:9'
          - '9:20'
    resolution:
      label: 'Resolution'
      description: 'The output resolution of each generated image. Higher resolution can increase cost and generation time.'
      type: 'string'
      default: '1k'
      required: false
      constraints:
        options:
          - '1k'
          - '2k'
    transparent_background:
      label: 'Request transparent background'
      description: 'Asks Grok to generate a PNG with a genuine transparent alpha-channel background. This is best effort because xAI does not provide a native transparency control.'
      type: 'boolean'
      default: false
      required: false
text_to_video:
  input:
    description: 'A text description of the video to generate.'
    type: 'string'
    default: ''
    required: true
  authentication:
    description: 'xAI API key.'
    type: 'string'
    default: ''
    required: true
  configuration:
    duration:
      label: 'Video duration'
      description: 'Length of the generated video in seconds. Longer videos cost more and take longer to generate.'
      type: 'integer'
      default: 5
      required: false
      constraints:
        min: 1
        max: 15
    aspect_ratio:
      label: 'Aspect ratio'
      description: 'The width-to-height ratio of the generated video.'
      type: 'string'
      default: '16:9'
      required: false
      constraints:
        options:
          - '1:1'
          - '16:9'
          - '9:16'
          - '4:3'
          - '3:4'
          - '3:2'
          - '2:3'
    resolution:
      label: 'Resolution'
      description: 'The generated video resolution. Higher resolution costs more.'
      type: 'string'
      default: '480p'
      required: false
      constraints:
        options:
          - '480p'
          - '720p'
image_to_video:
  input:
    description: 'A still image to animate.'
    type: 'file'
    default: ''
    required: true
  authentication:
    description: 'xAI API key.'
    type: 'string'
    default: ''
    required: true
  configuration:
    prompt:
      label: 'Animation prompt'
      description: 'Describe how the source image should move or change in the generated video.'
      type: 'string_long'
      default: ''
      required: true
    duration:
      label: 'Video duration'
      description: 'Length of the generated video in seconds. Longer videos cost more and take longer to generate.'
      type: 'integer'
      default: 5
      required: false
      constraints:
        min: 1
        max: 15
    aspect_ratio:
      label: 'Aspect ratio'
      description: 'The width-to-height ratio of the generated video.'
      type: 'string'
      default: '16:9'
      required: false
      constraints:
        options:
          - '1:1'
          - '16:9'
          - '9:16'
          - '4:3'
          - '3:4'
          - '3:2'
          - '2:3'
    resolution:
      label: 'Resolution'
      description: 'The generated video resolution. Higher resolution costs more.'
      type: 'string'
      default: '480p'
      required: false
      constraints:
        options:
          - '480p'
          - '720p'
          - '1080p'
