chat:
  input:
    description: 'Messages supplied to the model.'
    type: 'array'
    default:
      - { role: 'system', content: 'You are a helpful assistant.' }
      - { role: 'user', content: 'Introduce yourself!' }
    required: true
  authentication:
    description: 'xAI API key.'
    type: 'string'
    default: ''
    required: true
  configuration:
    max_tokens:
      label: 'Max tokens'
      description: 'The maximum number of tokens generated in the response.'
      type: 'integer'
      default: 4096
      required: false
      constraints:
        min: 1
    temperature:
      label: 'Temperature'
      description: 'Sampling temperature. Change temperature or Top P, but normally not both.'
      type: 'float'
      default: 1
      required: false
      constraints:
        min: 0
        max: 2
        step: 0.1
    top_p:
      label: 'Top P'
      description: 'Nucleus sampling probability. Change Top P or temperature, but normally not both.'
      type: 'float'
      default: 1
      required: false
      constraints:
        min: 0
        max: 1
        step: 0.1
    frequency_penalty:
      label: 'Frequency penalty'
      description: 'Penalizes tokens according to how often they already occur.'
      type: 'float'
      default: 0
      required: false
      constraints:
        min: -2
        max: 2
        step: 0.1
    presence_penalty:
      label: 'Presence penalty'
      description: 'Penalizes tokens that have already occurred.'
      type: 'float'
      default: 0
      required: false
      constraints:
        min: -2
        max: 2
        step: 0.1
    seed:
      label: 'Seed'
      description: 'Requests deterministic sampling on a best-effort basis.'
      type: 'integer'
      default: 0
      required: false
