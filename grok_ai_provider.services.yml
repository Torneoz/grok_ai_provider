services:
  grok_ai_provider.responses_client:
    class: Drupal\grok_ai_provider\Service\XaiResponsesClient
    arguments: ['@http_client', '@string_translation']

  grok_ai_provider.images_client:
    class: Drupal\grok_ai_provider\Service\XaiImagesClient
    arguments: ['@http_client', '@string_translation']

  grok_ai_provider.videos_client:
    class: Drupal\grok_ai_provider\Service\XaiVideosClient
    arguments: ['@http_client', '@string_translation']

  grok_ai_provider.audio_client:
    class: Drupal\grok_ai_provider\Service\XaiAudioClient
    arguments: ['@http_client', '@string_translation']

  grok_ai_provider.explorer_results:
    class: Drupal\grok_ai_provider\EventSubscriber\ExplorerResultSubscriber
    arguments: ['@grok_ai_provider.cost_estimator']
    tags:
      - { name: event_subscriber }

  grok_ai_provider.explorer_media:
    class: Drupal\grok_ai_provider\Service\ExplorerMediaHelper
    arguments: ['@module_handler', '@entity_type.manager', '@extension.path.resolver', '@file_system', '@request_stack']

  grok_ai_provider.cost_estimator:
    class: Drupal\grok_ai_provider\Service\GrokCostEstimator
    arguments: ['@config.factory', '@extension.path.resolver']
